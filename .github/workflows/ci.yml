name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build and types (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide whether the other passes.
      fail-fast: false
      matrix:
        # The floor declared in engines, and current. The floor is wrangler's,
        # which asks for more than Next.js does.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` rather than `npm install`: it refuses to run when the
      # lockfile and the manifests disagree, which is worth failing on.
      - run: npm ci

      - run: npm run lint

      # Before the types, because the app's route types are generated by the
      # build. Turborepo orders this correctly on its own; running them in
      # this order just makes a failure easier to read.
      - run: npm run build

      - run: npm run check-types

  worker:
    name: Bundle the Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches what `next build` cannot: that the app still bundles for
      # workerd, and that nothing Node-only has reached the Worker through a
      # provider import. Bundling needs no Cloudflare credentials — only
      # deploying does.
      - run: npx opennextjs-cloudflare build
        working-directory: apps/bookshelf
