version: 2

updates:
  # The root lockfile covers every workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Routine bumps arrive as one pull request; majors come on their own,
      # because those are the ones worth reading.
      routine:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
